# Dependency manifest: every solver and toolchain version, pinned. Each
# (dependency, platform) build is published as an asset on a per-dependency
# release `<dep>-<version>`. Expanded by scripts/manifest.py; tracked upstream by
# scripts/update_check.py.
#
# The update bot rewrites `version`/`commit` in place, so they must stay on their
# own line and never move inside an inline table.
#
# A dep may also carry `rebuild = <n>`, which appends `-rebuild<n>` to its identity
# (release tag, asset names, the downstream pin) without touching the upstream
# version it builds. Bump it to republish the same source built under different
# conditions — new flags, a new toolchain — so downstream picks the rebuild up.

schema = 2

# `platform` is the libc-aware build id; `triple` is what appears in asset names.
# `mznarch` is only a recipe input for upstream build systems that branch on it,
# NOT the platform identity -- both musl platforms report "linux", and win64-arm
# reports "win64".
#
# manylinux_2_34 gives a glibc 2.34 floor, which is also what the official Qt 6
# Linux binaries need.
[platforms.linux]
runner    = "ubuntu-24.04"
container = "quay.io/pypa/manylinux_2_34_x86_64"
mznarch   = "linux"
triple    = "x86_64-linux-gnu"
setup     = "dnf -y install zlib-devel patch which file 2>/dev/null || true"
cmake_generator = "Unix Makefiles"   # manylinux has make + gcc but not ninja

[platforms.linux-arm64]
runner    = "ubuntu-24.04-arm"
container = "quay.io/pypa/manylinux_2_34_aarch64"
mznarch   = "linux-arm64"
triple    = "aarch64-linux-gnu"
setup     = "dnf -y install zlib-devel patch which file 2>/dev/null || true"
cmake_generator = "Unix Makefiles"   # manylinux has make + gcc but not ninja

[platforms.musl]
runner    = "ubuntu-24.04"
container = "alpine:3.20"
mznarch   = "linux"
triple    = "x86_64-linux-musl"
setup     = "apk add --no-cache bash build-base cmake ninja git curl autoconf automake libtool pkgconf zlib-dev linux-headers"

[platforms.musl-arm64]
runner    = "ubuntu-24.04-arm"
container = "alpine:3.20"
mznarch   = "linux-arm64"
triple    = "aarch64-linux-musl"
setup     = "apk add --no-cache bash build-base cmake ninja git curl autoconf automake libtool pkgconf zlib-dev linux-headers"

[platforms.osx]
# arm64 host.
# macos-26 (AppleClang 21), not macos-14 (AppleClang 15): clang 15 wrongly rejects Gecode
# 6.4's Pack::calc_dff_lower_bound, where the template parameter `l` shadows Pack's data
# member `l` in a static member function. Verified accepted by clang 21.
runner    = "macos-26"
container = ""                  # native (no container)
mznarch   = "osx"
triple    = "aarch64-apple-darwin"

[platforms.osx.env]
# Without this the binaries inherit the runner's own macOS version as their
# floor, which would silently rise with the image. 12.0 because Qt 6.9 is built
# for it (so gecode_gist and the IDE cannot go lower), and arm64 itself bottoms
# out at macOS 11. CMake reads this; or-tools needs the flag in its .bazelrc.
MACOSX_DEPLOYMENT_TARGET = "12.0"
CMAKE_OSX_ARCHITECTURES  = "arm64"

[platforms.osx-intel]
# Separate package, not a universal binary alongside [platforms.osx] -- kept
# because it's still requested, dropped from the default recommendation.
# macos-26-intel: real Intel hardware (not cross-compiled), same AppleClang 21
# as the arm64 runner -- see [platforms.osx] for why that version matters.
# GitHub's last-supported Intel macOS image; retires alongside macos-15-intel
# in fall 2027 (github.blog/changelog, 2026-02-26).
runner    = "macos-26-intel"
container = ""
mznarch   = "osx"
triple    = "x86_64-apple-darwin"

[platforms.osx-intel.env]
MACOSX_DEPLOYMENT_TARGET = "12.0"
CMAKE_OSX_ARCHITECTURES  = "x86_64"

[platforms.win64]
runner    = "windows-2022"
container = ""                  # native
mznarch   = "win64"
triple    = "x86_64-windows"

[platforms.win64-arm]
# mznarch stays "win64": recipes branch on it for MSVC behaviour, which is the
# same on ARM64 (e.g. or-tools' -Wno-implicit-fallthrough patch).
runner    = "windows-11-arm"
container = ""
mznarch   = "win64"
triple    = "aarch64-windows"

[platforms.wasm]
# Doubles as the toolchain pin: `manifest.py versions` reports the tag as `emsdk`,
# so libminizinc links these archives with the emscripten that built them. A bump
# rebuilds every wasm asset (changed_deps() bails out on a platform edit).
runner    = "ubuntu-24.04"
container = "emscripten/emsdk:6.0.8"
mznarch   = "wasm"
triple    = "wasm32-emscripten"

# Build tooling that is not shipped but changes the produced binaries.
[toolchain.coinbrew]
# Replaces the historic unpinned `curl .../coinbrew/master/coinbrew` in cbc.sh.
# coinbrew has no recent release (last tag v2.0 is from 2022 and lacks Windows
# fixes), so we pin a `master` commit and let the bot track the branch head.
commit = "50539b4ea785cb2088366dc7f26930ec5c5b4546"
track  = { kind = "branch-head", repo = "https://github.com/coin-or/coinbrew", branch = "master" }

[toolchain.bazel]
# 9.x is required for Windows ARM64: Bazel 8 hangs forever fetching repositories
# there (bazelbuild/bazel#28520, a JDK virtual-thread bug). The fixed JDK ships from
# 9.0.1, and 9.0.2 is the first release whose windows-arm64 package is not carrying
# amd64 DLLs (#28941). Ignored on musl, where the recipe uses Alpine's bazel8 package.
version = "9.2.0"
track   = { kind = "github-release", repo = "bazelbuild/bazel", pattern = '^(\d+\.\d+\.\d+)$' }

[toolchain.bazelisk]
version = "v1.29.0"
track   = { kind = "github-release", repo = "bazelbuild/bazelisk", pattern = '^v(\d+\.\d+\.\d+)$' }

[toolchain.rules_pkg]
# Consumed via resources/or-tools/MODULE.bazel.in, which the recipe fills in from
# this value -- so a bump here is the whole change.
version = "1.3.0"
track   = { kind = "bcr-module", module = "rules_pkg" }


[toolchain.qt]
# Qt for gecode_gist, one version across linux/osx/win64. Downloaded on the fly via
# aqtinstall (in-container on linux; via install-qt-action on the native osx/win64 runners).
# The MiniZincIDE bundles gecode_gist, so keep this aligned with the IDE's Qt.
#
# The version is squeezed from both sides — check both before bumping:
#  - FLOOR: >= 6.9.2 (or 6.8.4, which is not open source). Apple removed the AGL framework
#    in macOS 26, so older Qt fails Gecode's GECODE_GIST_QT_LINKS test on the macos-26
#    runner with "framework 'AGL' not found" (QTBUG-137687).
#  - CEILING: Qt's Linux binaries must run on manylinux_2_34 (glibc 2.34). Qt 6.10 is still
#    "linked against glibc 2.34", but Qt 6.11 requires glibc 2.39+ and
#    would break gecode_gist:linux unless that container's glibc floor is also raised.
version = "6.10.3"
track   = { kind = "manual" }


[deps.cbc]
recipe       = "recipes/cbc.sh"
version      = "2.10.13"
uses         = ["coinbrew"]
artifact_dir = "cbc"
# No win64-arm: COIN-OR publishes no ARM64 MSVC package, and building from source
# there would hit the same libtool bug as win64 plus ARM64 MSVC on top.
platforms    = ["linux", "linux-arm64", "musl", "musl-arm64", "osx", "osx-intel", "win64", "wasm"]
track        = { kind = "git-tags", repo = "https://github.com/coin-or/Cbc", pattern = 'releases/(\d+\.\d+\.\d+)' }
[deps.cbc.env.osx]
CFLAGS   = "-arch arm64"
CXXFLAGS = "-arch arm64"
[deps.cbc.env.osx-intel]
CFLAGS   = "-arch x86_64"
CXXFLAGS = "-arch x86_64"
[deps.cbc.env.win64]
# Prebuilt by COIN-OR: msvc17 is VS2022, matching the runner, and `md` is the
# dynamic CRT, matching CMake's Release default for MiniZinc itself.
CBC_MSVC_ASSET = "Cbc-releases.2.10.13-w64-msvc17-md.zip"

[deps.highs]
recipe       = "recipes/highs.sh"
version      = "v1.15.1"
artifact_dir = "highs"
platforms    = ["linux", "linux-arm64", "musl", "musl-arm64", "osx", "osx-intel", "win64", "win64-arm", "wasm"]
track        = { kind = "git-tags", repo = "https://github.com/ERGO-Code/HiGHS", pattern = 'v(\d+\.\d+\.\d+)' }

[deps.or-tools]
recipe       = "recipes/or-tools.sh"
version      = "v9.15"
uses         = ["bazel", "bazelisk", "rules_pkg"]
overlay      = "resources/or-tools"     # rebuilt in pr-validate if these files change
artifact_dir = "or-tools"
platforms    = ["linux", "linux-arm64", "musl", "musl-arm64", "osx", "osx-intel", "win64", "win64-arm"]   # no wasm
track        = { kind = "git-tags", repo = "https://github.com/google/or-tools", pattern = 'v(\d+\.\d+)' }

[deps.gecode]
recipe       = "recipes/gecode.sh"
# `version` is the bare number; the recipe checks out `release-$DEP_VERSION`. The
# tracked pattern captures the same bare number so the bot compares like for like.
version      = "6.4.0"
artifact_dir = "gecode"
platforms    = ["linux", "linux-arm64", "musl", "musl-arm64", "osx", "osx-intel", "win64", "win64-arm", "wasm"]
track        = { kind = "git-tags", repo = "https://github.com/Gecode/gecode", pattern = 'release-(\d+\.\d+\.\d+)' }

[deps.gecode.env.win64-arm]
# /bigobj: extensional-tuple-set.cpp exceeds MSVC's object-file section limit
# (C1128) when targeting ARM64.
# /Zc:__cplusplus: Gecode's bundled Boost.Interval has no ARM64 hardware rounding
# control and falls back to its C99 path only when __cplusplus reports C++11 or
# later. MSVC reports 199711L unless this flag is given, so the header #errors.
CXXFLAGS = "/bigobj /Zc:__cplusplus"

[deps.gecode_gist]
recipe       = "recipes/gecode.sh"
gist         = true             # → gecode.sh 1
source_of    = "gecode"         # shares gecode's commit; never pinned independently
uses         = ["qt"]           # Qt: aqtinstall (linux container) / install-qt-action (osx, win64*)
artifact_dir = "gecode_gist"
# NOT musl / wasm: Gist needs a GUI which those platforms do not have.
platforms    = ["linux", "linux-arm64", "osx", "osx-intel", "win64", "win64-arm"]

[deps.gecode_gist.env.win64-arm]
# Same as gecode's win64-arm block: the core sources this recipe also compiles
# for Gist hit the same MSVC ARM64 issues (see [deps.gecode.env.win64-arm]).
CXXFLAGS = "/bigobj /Zc:__cplusplus"

[deps.chuffed]
recipe       = "recipes/chuffed.sh"
version      = "0.14.0"
artifact_dir = "chuffed"
platforms    = ["linux", "linux-arm64", "musl", "musl-arm64", "osx", "osx-intel", "win64", "win64-arm", "wasm"]
track        = { kind = "git-tags", repo = "https://github.com/Chuffed/chuffed", pattern = '^(\d+\.\d+\.\d+)$' }

[deps.openssl]
# Runtime DLLs for the IDE's Windows installer. Fetched from slproweb.com (the
# de-facto Windows OpenSSL build) rather than checked in, so ARM64 is covered and
# the binaries are not carried in git. slproweb keeps only the newest patch per
# branch, so this version has to be bumped when it 404s.
recipe       = "recipes/openssl.sh"
version      = "3.5.8"
artifact_dir = "openssl"
platforms    = ["win64", "win64-arm"]
track        = { kind = "manual" }
[deps.openssl.env.win64]
OPENSSL_EXE  = "Win64OpenSSL_Light-3_5_8.exe"
[deps.openssl.env.win64-arm]
OPENSSL_EXE  = "Win64ARMOpenSSL_Light-3_5_8.exe"
